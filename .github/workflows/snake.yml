name: GitHub contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at 00:00 UTC (adjust if you want)
  workflow_dispatch:      # allows manual run from Actions tab
  push:
    branches: ["main", "master"]

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Generate contribution snake SVG
        uses: platane/snk@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: nishadadilshan
          output: output/github-contribution-grid-snake.svg
          include-owner: true
          # optional visual params:
          # theme: default
          # hide_border: false

      - name: Commit generated file (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add output/github-contribution-grid-snake.svg
            git commit -m "chore: update contribution snake"
            git push
          else
            echo "No changes to commit."
          fi
